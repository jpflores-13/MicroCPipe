name: microc_mustache
## Loop calling (config analysis: [loops]). Kept separate because mustache-hic is a
## pip package that compiles C++ code on install; it must not break the core envs.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - cooler>=0.9
  - cxx-compiler
  - pip:
      - mustache-hic>=1.3.2
